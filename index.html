<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face the Puzzle - Noise Junior</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['"Fira Sans Condensed"', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brandYellow: '#FFF4A3',
                        brandGreen: '#12B981',
                        brandBoardGreen: '#23C45E',
                        brandRed: '#EF4444',
                        brandPurple: '#8B5CF6',
                        brandPink: '#EC4899',
                        brandDark: '#111827',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FFF9D2;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .font-fira {
            font-family: 'Fira Sans Condensed', sans-serif;
        }

        .top-left-header, 
        .header-logo {
            background: none !important;
            border: none !important;
            box-shadow: none !important;
        }

        .sticker-badge {
            display: inline-block;
            transform: rotate(-2deg);
            box-shadow: 2px 4px 12px rgba(0,0,0,0.08);
            transition: transform 0.2s ease;
        }
        .sticker-badge:hover {
            transform: rotate(0deg) scale(1.04);
        }

        .piece-item {
            cursor: grab;
            user-select: none;
            touch-action: none;
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .piece-item:active {
            cursor: grabbing;
            transform: scale(1.08);
            z-index: 50;
        }
        .piece-item.selected {
            filter: drop-shadow(0 0 10px #EF4444);
            transform: scale(1.05);
            z-index: 40;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between relative selection:bg-yellow-200">

    <header class="w-full bg-white border-b border-yellow-200/80 px-4 sm:px-8 py-3.5 flex items-center justify-between relative z-20 shadow-sm">
        <!-- Top Left Clean Logo -->
        <div class="flex items-center top-left-header">
            <img src="logo.png" alt="Noise Junior" class="h-9 sm:h-11 w-auto object-contain block bg-transparent" />
        </div>

        <!-- Navigation Tabs (Explorer 2 First) -->
        <nav class="flex items-center space-x-1 sm:space-x-2 bg-slate-100 p-1.5 rounded-full border border-slate-200">
            <button id="tab-explorer" onclick="switchTab('explorer')" class="px-4 sm:px-6 py-2 rounded-full font-fira font-extrabold text-sm sm:text-base tracking-wider transition-all duration-200 flex items-center bg-slate-900 text-white shadow-sm">
                <span>EXPLORER 2</span>
            </button>
            <button id="tab-champ" onclick="switchTab('champ')" class="px-4 sm:px-6 py-2 rounded-full font-fira font-extrabold text-sm sm:text-base tracking-wider transition-all duration-200 flex items-center text-slate-700 hover:text-slate-900">
                <span>CHAMP 3</span>
            </button>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto w-full px-4 sm:px-6 py-6 sm:py-8 flex-grow relative z-10">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
            
            <!-- LEFT PANEL: Pile of Pieces & Controls -->
            <div class="lg:col-span-5 flex flex-col justify-between space-y-6">
                
                <div>
                    <h1 class="font-fira font-black text-4xl sm:text-5xl text-slate-900 leading-none tracking-tight">
                        Face the<br/>
                        Puz<span class="text-amber-400 inline-block transform hover:rotate-45 transition-transform cursor-pointer">✱</span>le
                    </h1>
                    <p class="text-slate-600 mt-2 text-sm font-medium">
                        Match the cut shapes to complete the watch face!
                    </p>
                </div>

                <!-- TODAY'S FACE BADGE -->
                <div class="bg-white rounded-2xl p-4 border-2 border-amber-200/60 shadow-sm flex items-center justify-between">
                    <div>
                        <span id="watch-series-tag" class="text-[10px] font-extrabold text-slate-400 font-fira uppercase tracking-widest block mb-1">
                            EXPLORER 2 SERIES
                        </span>
                        <div class="sticker-badge bg-emerald-400 text-slate-900 font-fira font-black text-base px-3 py-1 rounded-lg uppercase tracking-wide border-2 border-slate-900 shadow-sm" id="face-name-badge">
                            CAT AT NIGHT
                        </div>
                    </div>
                </div>

                <!-- PILE OF PIECES DISPLAY AREA -->
                <div class="bg-white rounded-3xl p-6 border-2 border-amber-200/80 shadow-lg text-center flex flex-col items-center justify-center space-y-4 min-h-[260px] relative">
                    <span class="font-fira font-extrabold text-xs uppercase tracking-widest text-slate-400">ACTIVE PIECE STACK</span>
                    
                    <!-- Stack Holder -->
                    <div id="piece-stack-card" class="relative w-36 h-36 flex items-center justify-center">
                        <!-- Current piece rendered via JS -->
                    </div>

                    <button onclick="shuffleStack()" class="px-6 py-2.5 rounded-xl font-fira font-black text-sm bg-slate-900 text-white shadow-md hover:bg-slate-800 transition-all flex items-center space-x-2">
                        <span>🔀 RANDOMIZE / NEXT PIECE</span>
                    </button>
                </div>

            </div>

            <!-- RIGHT PANEL: Board Canvas with Outlined Jigsaw Cuts -->
            <div class="lg:col-span-7 space-y-6">
                
                <div class="bg-white rounded-3xl p-4 sm:p-6 border-2 border-amber-200/80 shadow-xl">
                    
                    <!-- Board Header Controls -->
                    <div class="flex items-center justify-between mb-4 px-2">
                        <div class="flex items-center space-x-2">
                            <span class="font-fira font-black text-xs sm:text-sm uppercase tracking-widest text-slate-500">PUZZLE BOARD</span>
                        </div>

                        <!-- Pieces & Actions -->
                        <div class="flex items-center space-x-2">
                            <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-xl border border-slate-200 mr-2">
                                <button onclick="changePieceCount(-1)" class="w-7 h-7 rounded-lg bg-white font-black text-slate-700 hover:bg-slate-200 shadow-sm flex items-center justify-center">-</button>
                                <span id="grid-size-text" class="font-fira font-bold text-xs px-2 text-slate-800">12 pcs</span>
                                <button onclick="changePieceCount(1)" class="w-7 h-7 rounded-lg bg-white font-black text-slate-700 hover:bg-slate-200 shadow-sm flex items-center justify-center">+</button>
                            </div>

                            <button onclick="toggleHint()" class="px-3 py-1.5 rounded-xl font-fira font-extrabold text-xs bg-emerald-500 text-white hover:bg-emerald-600 transition-all">
                                💡 HINT
                            </button>
                            <button onclick="reCutPuzzle()" class="px-3 py-1.5 rounded-xl font-fira font-extrabold text-xs bg-pink-500 text-white hover:bg-pink-600 transition-all">
                                ✂ NEW CUT
                            </button>
                            <button onclick="resetPuzzle()" class="px-3 py-1.5 rounded-xl font-fira font-extrabold text-xs bg-amber-400 text-slate-900 hover:bg-amber-500 transition-all">
                                ↺ RESET
                            </button>
                        </div>
                    </div>

                    <!-- Main Puzzle Board Container -->
                    <div class="relative w-full aspect-square max-w-[500px] mx-auto bg-brandBoardGreen rounded-3xl p-3 sm:p-4 shadow-inner border-4 border-emerald-600/30 overflow-hidden" id="puzzle-container">
                        
                        <!-- Hint Canvas Overlay -->
                        <canvas id="hint-canvas" class="absolute inset-0 w-full h-full p-3 sm:p-4 opacity-0 transition-opacity duration-300 pointer-events-none rounded-3xl z-0"></canvas>

                        <!-- Jigsaw Outlines Canvas (Shows full jigsaw cut lines on board) -->
                        <canvas id="outlines-canvas" class="absolute inset-0 w-full h-full p-3 sm:p-4 pointer-events-none rounded-3xl z-10"></canvas>

                        <!-- Interactive Grid Slots Container -->
                        <div id="puzzle-grid" class="w-full h-full grid relative z-20">
                            <!-- Slots created via JS -->
                        </div>
                    </div>

                    <div class="mt-4 text-center">
                        <button onclick="tryAnotherFace()" class="px-5 py-2.5 rounded-2xl font-fira font-black text-sm bg-slate-900 text-white shadow-md hover:bg-slate-800 transition-all">
                            🔄 TRY ANOTHER WATCH FACE
                        </button>
                    </div>

                </div>

            </div>

        </div>
    </main>

    <!-- Win Modal -->
    <div id="win-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 text-center border-4 border-amber-300 shadow-2xl transform scale-95 transition-transform duration-300 relative overflow-hidden" id="win-modal-card">
            
            <div class="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl shadow-inner border-2 border-amber-300 animate-bounce">
                🏆
            </div>

            <span class="bg-emerald-100 text-emerald-800 font-fira font-black text-xs px-3 py-1 rounded-full uppercase tracking-wider inline-block mb-2">
                PUZZLE COMPLETED!
            </span>

            <h2 class="font-fira font-black text-2xl sm:text-3xl text-slate-900 leading-tight mb-2">
                Well Done!<br/>
                <span class="text-amber-500">You are Noise Junior Certified 👀💛</span>
            </h2>

            <p class="text-slate-600 text-sm font-medium mb-6">
                Awesome job! You matched all the jigsaw cuts perfectly.
            </p>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
                <button onclick="tryAnotherFace(); closeWinModal();" class="w-full sm:w-auto px-6 py-3 rounded-2xl font-fira font-black text-sm bg-emerald-500 text-white shadow-lg hover:bg-emerald-600 transition-all">
                    NEXT WATCH FACE ➔
                </button>
                <button onclick="closeWinModal()" class="w-full sm:w-auto px-5 py-3 rounded-2xl font-fira font-bold text-sm bg-slate-100 text-slate-700 hover:bg-slate-200 transition-all">
                    VIEW BOARD
                </button>
            </div>
        </div>
    </div>

    <script>
        const WATCH_FACES = {
            explorer: [
                { id: 'e1', name: 'CAT AT NIGHT', img: 'Gemini_Generated_Image_1ppnm1ppnm1ppnm1.jpeg' },
                { id: 'e2', name: 'SNEAKER', img: 'Gemini_Generated_Image_1ppnm1ppnm1ppnm1 (1).jpeg' },
                { id: 'e3', name: 'CAPYBARA', img: 'Capybara.png' },
                { id: 'e4', name: 'RUNNER', img: 'Frame 2147226976.png' }
            ],
            champ: [
                { id: 'c1', name: 'RUNNER', img: 'Frame 2147226976.png' },
                { id: 'c2', name: 'ROPE CLIMBER', img: 'Frame 2147226978.png' },
                { id: 'c3', name: 'HIGH FIVE', img: 'Packaging watchface.png' },
                { id: 'c4', name: 'LEGO', img: 'Lego (1).png' }
            ]
        };

        let currentTab = 'explorer';
        let currentFaceIndex = 0;
        let gridCols = 4;
        let gridRows = 3;
        let activePieceCount = 12;
        
        let puzzlePieces = [];
        let unplacedPieces = [];
        let activeStackIndex = 0;
        let boardState = [];
        let pieceEdges = [];
        let hintTimeout = null;

        let fullImageCanvas = document.createElement('canvas');
        const CANVAS_SIZE = 600;
        fullImageCanvas.width = CANVAS_SIZE;
        fullImageCanvas.height = CANVAS_SIZE;

        // Path generator for jigsaw tab cuts
        function drawJigsawPath(ctx, width, height, top, right, bottom, left) {
            ctx.beginPath();
            ctx.moveTo(0, 0);

            // TOP EDGE
            if (top === 0) {
                ctx.lineTo(width, 0);
            } else {
                ctx.lineTo(width * 0.35, 0);
                ctx.bezierCurveTo(width * 0.35, -top * height * 0.18, width * 0.42, -top * height * 0.22, width * 0.5, -top * height * 0.22);
                ctx.bezierCurveTo(width * 0.58, -top * height * 0.22, width * 0.65, -top * height * 0.18, width * 0.65, 0);
                ctx.lineTo(width, 0);
            }

            // RIGHT EDGE
            if (right === 0) {
                ctx.lineTo(width, height);
            } else {
                ctx.lineTo(width, height * 0.35);
                ctx.bezierCurveTo(width + right * width * 0.18, height * 0.35, width + right * width * 0.22, height * 0.42, width + right * width * 0.22, height * 0.5);
                ctx.bezierCurveTo(width + right * width * 0.22, height * 0.58, width + right * width * 0.18, height * 0.65, width, height * 0.65);
                ctx.lineTo(width, height);
            }

            // BOTTOM EDGE
            if (bottom === 0) {
                ctx.lineTo(0, height);
            } else {
                ctx.lineTo(width * 0.65, height);
                ctx.bezierCurveTo(width * 0.65, height + bottom * height * 0.18, width * 0.58, height + bottom * height * 0.22, width * 0.5, height + bottom * height * 0.22);
                ctx.bezierCurveTo(width * 0.42, height + bottom * height * 0.22, width * 0.35, height + bottom * height * 0.18, width * 0.35, height);
                ctx.lineTo(0, height);
            }

            // LEFT EDGE
            if (left === 0) {
                ctx.lineTo(0, 0);
            } else {
                ctx.lineTo(0, height * 0.65);
                ctx.bezierCurveTo(-left * width * 0.18, height * 0.65, -left * width * 0.22, height * 0.58, -left * width * 0.22, height * 0.5);
                ctx.bezierCurveTo(-left * width * 0.22, height * 0.42, -left * width * 0.18, height * 0.35, 0, height * 0.35);
                ctx.lineTo(0, 0);
            }

            ctx.closePath();
        }

        window.addEventListener('load', () => {
            initGame();
        });

        function switchTab(tabName) {
            if (currentTab === tabName) return;
            currentTab = tabName;
            currentFaceIndex = 0;

            const btnChamp = document.getElementById('tab-champ');
            const btnExplorer = document.getElementById('tab-explorer');

            if (tabName === 'explorer') {
                btnExplorer.className = "px-4 sm:px-6 py-2 rounded-full font-fira font-extrabold text-sm sm:text-base tracking-wider transition-all duration-200 flex items-center bg-slate-900 text-white shadow-sm";
                btnChamp.className = "px-4 sm:px-6 py-2 rounded-full font-fira font-extrabold text-sm sm:text-base tracking-wider transition-all duration-200 flex items-center text-slate-700 hover:text-slate-900";
                document.getElementById('watch-series-tag').innerText = 'EXPLORER 2 SERIES';
            } else {
                btnChamp.className = "px-4 sm:px-6 py-2 rounded-full font-fira font-extrabold text-sm sm:text-base tracking-wider transition-all duration-200 flex items-center bg-slate-900 text-white shadow-sm";
                btnExplorer.className = "px-4 sm:px-6 py-2 rounded-full font-fira font-extrabold text-sm sm:text-base tracking-wider transition-all duration-200 flex items-center text-slate-700 hover:text-slate-900";
                document.getElementById('watch-series-tag').innerText = 'CHAMP 3 SERIES';
            }

            initGame();
        }

        function getCurrentFaceData() {
            return WATCH_FACES[currentTab][currentFaceIndex];
        }

        function tryAnotherFace() {
            const pool = WATCH_FACES[currentTab];
            currentFaceIndex = (currentFaceIndex + 1) % pool.length;
            initGame();
        }

        function initGame() {
            const faceData = getCurrentFaceData();
            document.getElementById('face-name-badge').innerText = faceData.name;
            
            const ctx = fullImageCanvas.getContext('2d');
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            const img = new Image();
            img.src = faceData.img;
            img.onload = () => {
                ctx.drawImage(img, 0, 0, CANVAS_SIZE, CANVAS_SIZE);
                finishInit();
            };
            img.onerror = () => {
                ctx.fillStyle = '#111827';
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                ctx.fillStyle = '#FFFFFF';
                ctx.font = '900 60px "Fira Sans Condensed", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(faceData.name, CANVAS_SIZE/2, CANVAS_SIZE/2);
                finishInit();
            };
        }

        function finishInit() {
            const hintCanvas = document.getElementById('hint-canvas');
            hintCanvas.width = CANVAS_SIZE;
            hintCanvas.height = CANVAS_SIZE;
            const hintCtx = hintCanvas.getContext('2d');
            hintCtx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            hintCtx.drawImage(fullImageCanvas, 0, 0, CANVAS_SIZE, CANVAS_SIZE);

            generateEdgeMap();
            createPuzzlePieces();
            drawBoardJigsawOutlines();
        }

        function generateEdgeMap() {
            pieceEdges = [];
            for (let r = 0; r < gridRows; r++) {
                pieceEdges[r] = [];
                for (let c = 0; c < gridCols; c++) {
                    pieceEdges[r][c] = {
                        top: r === 0 ? 0 : -pieceEdges[r-1][c].bottom,
                        right: c === gridCols - 1 ? 0 : (Math.random() < 0.5 ? 1 : -1),
                        bottom: r === gridRows - 1 ? 0 : (Math.random() < 0.5 ? 1 : -1),
                        left: c === 0 ? 0 : -pieceEdges[r][c-1].right
                    };
                }
            }
        }

        function drawBoardJigsawOutlines() {
            const canvas = document.getElementById('outlines-canvas');
            canvas.width = CANVAS_SIZE;
            canvas.height = CANVAS_SIZE;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            const tileW = CANVAS_SIZE / gridCols;
            const tileH = CANVAS_SIZE / gridRows;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.setLineDash([6, 6]);
            ctx.lineWidth = 2.5;

            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const edges = pieceEdges[r][c];
                    ctx.save();
                    ctx.translate(c * tileW, r * tileH);
                    drawJigsawPath(ctx, tileW, tileH, edges.top, edges.right, edges.bottom, edges.left);
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }

        function changePieceCount(delta) {
            if (delta > 0 && activePieceCount < 16) {
                if (activePieceCount === 6) setGridDimensions(3, 3, 9);
                else if (activePieceCount === 9) setGridDimensions(4, 3, 12);
                else if (activePieceCount === 12) setGridDimensions(4, 4, 16);
            } else if (delta < 0 && activePieceCount > 6) {
                if (activePieceCount === 16) setGridDimensions(4, 3, 12);
                else if (activePieceCount === 12) setGridDimensions(3, 3, 9);
                else if (activePieceCount === 9) setGridDimensions(3, 2, 6);
            }
        }

        function setGridDimensions(cols, rows, count) {
            gridCols = cols;
            gridRows = rows;
            activePieceCount = count;
            document.getElementById('grid-size-text').innerText = `${count} pcs`;
            initGame();
        }

        function createPuzzlePieces() {
            puzzlePieces = [];
            boardState = new Array(gridCols * gridRows).fill(null);

            const tileWidth = CANVAS_SIZE / gridCols;
            const tileHeight = CANVAS_SIZE / gridRows;

            const padX = tileWidth * 0.3;
            const padY = tileHeight * 0.3;

            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const index = r * gridCols + c;
                    const edges = pieceEdges[r][c];

                    const pCanvas = document.createElement('canvas');
                    const canvasW = tileWidth + padX * 2;
                    const canvasH = tileHeight + padY * 2;
                    pCanvas.width = canvasW;
                    pCanvas.height = canvasH;
                    const pCtx = pCanvas.getContext('2d');

                    pCtx.save();
                    pCtx.translate(padX, padY);
                    
                    drawJigsawPath(pCtx, tileWidth, tileHeight, edges.top, edges.right, edges.bottom, edges.left);
                    pCtx.clip();

                    pCtx.drawImage(
                        fullImageCanvas,
                        c * tileWidth - padX, r * tileHeight - padY, canvasW, canvasH,
                        -padX, -padY, canvasW, canvasH
                    );

                    pCtx.restore();

                    // Edge outline on piece
                    pCtx.save();
                    pCtx.translate(padX, padY);
                    drawJigsawPath(pCtx, tileWidth, tileHeight, edges.top, edges.right, edges.bottom, edges.left);
                    pCtx.strokeStyle = 'rgba(0,0,0,0.3)';
                    pCtx.lineWidth = 2;
                    pCtx.stroke();
                    pCtx.restore();

                    puzzlePieces.push({
                        id: index,
                        row: r,
                        col: c,
                        dataUrl: pCanvas.toDataURL()
                    });
                }
            }

            unplacedPieces = [...puzzlePieces].sort(() => Math.random() - 0.5);
            activeStackIndex = 0;

            renderGridSlots();
            renderActiveStackPiece();
        }

        function renderGridSlots() {
            const gridEl = document.getElementById('puzzle-grid');
            gridEl.style.gridTemplateColumns = `repeat(${gridCols}, minmax(0, 1fr))`;
            gridEl.style.gridTemplateRows = `repeat(${gridRows}, minmax(0, 1fr))`;
            gridEl.innerHTML = '';

            for (let i = 0; i < gridCols * gridRows; i++) {
                const slot = document.createElement('div');
                slot.className = 'puzzle-slot rounded-2xl relative flex items-center justify-center cursor-pointer hover:bg-white/10 transition-colors';
                slot.dataset.slotIndex = i;

                slot.addEventListener('click', () => handleSlotClick(i));
                slot.addEventListener('dragover', (e) => e.preventDefault());
                slot.addEventListener('drop', (e) => handleDrop(e, i));

                gridEl.appendChild(slot);
            }
        }

        function renderActiveStackPiece() {
            const card = document.getElementById('piece-stack-card');
            card.innerHTML = '';

            if (unplacedPieces.length === 0) {
                card.innerHTML = `<span class="font-fira font-black text-emerald-600 text-sm uppercase">All pieces placed! 🎉</span>`;
                return;
            }

            if (activeStackIndex >= unplacedPieces.length) {
                activeStackIndex = 0;
            }

            const currentPiece = unplacedPieces[activeStackIndex];

            const img = document.createElement('img');
            img.src = currentPiece.dataUrl;
            img.className = 'piece-item w-full h-full object-contain cursor-grab active:cursor-grabbing selected';
            img.draggable = true;
            img.dataset.pieceId = currentPiece.id;

            img.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', currentPiece.id);
            });

            card.appendChild(img);
        }

        function shuffleStack() {
            if (unplacedPieces.length <= 1) return;
            activeStackIndex = (activeStackIndex + 1) % unplacedPieces.length;
            renderActiveStackPiece();
        }

        function handleSlotClick(slotIndex) {
            if (unplacedPieces.length === 0) return;
            const currentPiece = unplacedPieces[activeStackIndex];
            placePiece(currentPiece.id, slotIndex);
        }

        function handleDrop(e, slotIndex) {
            e.preventDefault();
            const pieceId = parseInt(e.dataTransfer.getData('text/plain'));
            if (!isNaN(pieceId)) {
                placePiece(pieceId, slotIndex);
            }
        }

        function placePiece(pieceId, slotIndex) {
            if (boardState[slotIndex] !== null) return;

            // Strict placement check
            if (pieceId !== slotIndex) {
                return; // Only correct jigsaw spot accepts piece
            }

            boardState[slotIndex] = pieceId;

            const slotEl = document.querySelector(`[data-slot-index="${slotIndex}"]`);
            const piece = puzzlePieces.find(p => p.id === pieceId);

            slotEl.innerHTML = `<img src="${piece.dataUrl}" class="absolute pointer-events-none max-w-none" style="width: 160%; height: 160%; top: -30%; left: -30%;">`;

            // Remove from unplaced stack
            unplacedPieces = unplacedPieces.filter(p => p.id !== pieceId);
            if (activeStackIndex >= unplacedPieces.length) {
                activeStackIndex = 0;
            }

            renderActiveStackPiece();
            checkWinState();
        }

        function checkWinState() {
            const isComplete = boardState.every((pieceId, idx) => pieceId === idx);
            if (isComplete) {
                setTimeout(() => {
                    triggerWinCelebration();
                }, 300);
            }
        }

        function toggleHint() {
            const hintCanvas = document.getElementById('hint-canvas');
            if (hintTimeout) clearTimeout(hintTimeout);

            hintCanvas.style.opacity = '0.35';
            hintTimeout = setTimeout(() => {
                hintCanvas.style.opacity = '0';
                hintTimeout = null;
            }, 1000);
        }

        function resetPuzzle() {
            boardState = new Array(gridCols * gridRows).fill(null);
            unplacedPieces = [...puzzlePieces].sort(() => Math.random() - 0.5);
            activeStackIndex = 0;
            renderGridSlots();
            renderActiveStackPiece();
        }

        function reCutPuzzle() {
            initGame();
        }

        function triggerWinCelebration() {
            confetti({
                particleCount: 110,
                spread: 80,
                origin: { y: 0.6 }
            });

            const modal = document.getElementById('win-modal');
            const card = document.getElementById('win-modal-card');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
        }

        function closeWinModal() {
            const modal = document.getElementById('win-modal');
            const card = document.getElementById('win-modal-card');
            modal.classList.add('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
        }
    </script>
</body>
</html>
