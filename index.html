<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face the Puzzle - Noise Junior</title>
  <style>
    :root {
      --bg-color: #FFF9E6;
      --board-bg: #1EC260;
      --text-dark: #1A1A1A;
      --brand-blue: #4A90E2;
      --brand-pink: #FF6B8B;
      --brand-yellow: #FFB800;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .top-left-logo {
      height: 48px;
      width: auto;
      display: block;
    }

    .tab-container {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 10px 24px;
      border-radius: 30px;
      border: 2px solid #1A1A1A;
      background: #FFFFFF;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--brand-yellow);
      box-shadow: 0 4px 0 #1A1A1A;
      transform: translateY(-2px);
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
      max-width: 600px;
    }

    .puzzle-board {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: var(--board-bg);
      border-radius: 24px;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      position: relative;
    }

    .board-slot {
      border: 2px dashed rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      background-size: 300% 200%;
    }

    .board-slot.filled {
      border: none;
    }

    .loose-pieces-panel {
      width: 100%;
      background: #FFFFFF;
      border: 2px solid #1A1A1A;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      min-height: 140px;
    }

    .puzzle-piece {
      width: 90px;
      height: 90px;
      border-radius: 8px;
      cursor: grab;
      background-size: 300% 200%;
      border: 2px solid rgba(0,0,0,0.1);
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      transition: transform 0.15s ease;
    }

    .puzzle-piece:hover {
      transform: scale(1.05);
    }

    .todays-face-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .todays-face-badge {
      background: #FFFFFF;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      border: 1px solid #1A1A1A;
    }

    .todays-face-name {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-dark);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-card {
      background: #FFFFFF;
      padding: 32px;
      border-radius: 24px;
      text-align: center;
      border: 3px solid #1A1A1A;
      box-shadow: 0 12px 32px rgba(0,0,0,0.2);
      max-width: 80%;
    }

    .modal-card h2 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .modal-btn {
      margin-top: 20px;
      padding: 12px 28px;
      background: var(--brand-blue);
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="Noise Junior" class="top-left-logo" />
    <div class="todays-face-badge">Today's Face</div>
  </header>

  <div class="tab-container">
    <button class="tab-btn active" id="tab-champ">Champ 3 🏆</button>
    <button class="tab-btn" id="tab-explorer">Explorer 2</button>
  </div>

  <div class="main-container">
    <div class="puzzle-board" id="board">
      <div class="board-slot" data-index="0"></div>
      <div class="board-slot" data-index="1"></div>
      <div class="board-slot" data-index="2"></div>
      <div class="board-slot" data-index="3"></div>
      <div class="board-slot" data-index="4"></div>
      <div class="board-slot" data-index="5"></div>
    </div>

    <div class="loose-pieces-panel" id="pieces-panel"></div>

    <div class="todays-face-container">
      <div class="todays-face-name" id="face-name">Active Runner</div>
    </div>
  </div>

  <div class="modal-overlay" id="win-modal">
    <div class="modal-card">
      <h2>Well Done! 🎉</h2>
      <p>You are Noise Junior Certified 👀💛</p>
      <button class="modal-btn" onclick="nextPuzzle()">Play Next Face</button>
    </div>
  </div>

  <script>
    const watchData = {
      champ: [
        { name: "Active Runner", img: "Frame 2147226976.png" },
        { name: "Monkey Bar Boy", img: "Frame 2147226978.png" },
        { name: "High Five Hands", img: "Packaging watchface.png" },
        { name: "Lego Bricks", img: "Lego (1).png" }
      ],
      explorer: [
        { name: "Active Runner", img: "Frame 2147226976.png" },
        { name: "Window Cat", img: "Gemini_Generated_Image_1ppnm1ppnm1ppnm1.jpeg" },
        { name: "Sneaker Step", img: "Gemini_Generated_Image_1ppnm1ppnm1ppnm1 (1).jpeg" },
        { name: "Lazy Capybara", img: "Capybara.png" }
      ]
    };

    let currentTab = 'champ';
    let currentPuzzleIndex = 0;
    let placedCount = 0;

    const boardSlots = document.querySelectorAll('.board-slot');
    const piecesPanel = document.getElementById('pieces-panel');
    const faceNameEl = document.getElementById('face-name');
    const modal = document.getElementById('win-modal');

    function loadPuzzle() {
      placedCount = 0;
      modal.style.display = 'none';
      const activeItem = watchData[currentTab][currentPuzzleIndex];
      faceNameEl.textContent = activeItem.name;

      boardSlots.forEach((slot) => {
        slot.innerHTML = '';
        slot.classList.remove('filled');
        slot.style.backgroundImage = 'none';
      });

      piecesPanel.innerHTML = '';
      
      let pieces = [];
      for (let row = 0; row < 2; row++) {
        for (let col = 0; col < 3; col++) {
          const index = row * 3 + col;
          pieces.push({ index, row, col });
        }
      }

      pieces.sort(() => Math.random() - 0.5);

      pieces.forEach(p => {
        const piece = document.createElement('div');
        piece.className = 'puzzle-piece';
        piece.draggable = true;
        piece.dataset.index = p.index;
        
        piece.style.backgroundImage = `url('${activeItem.img}')`;
        piece.style.backgroundPosition = `${p.col * 50}% ${p.row * 100}%`;

        piece.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', p.index);
        });

        piecesPanel.appendChild(piece);
      });
    }

    boardSlots.forEach(slot => {
      slot.addEventListener('dragover', (e) => e.preventDefault());
      
      slot.addEventListener('drop', (e) => {
        e.preventDefault();
        const draggedIndex = e.dataTransfer.getData('text/plain');
        const slotIndex = slot.dataset.index;

        if (draggedIndex === slotIndex && !slot.classList.contains('filled')) {
          slot.classList.add('filled');
          
          const activeItem = watchData[currentTab][currentPuzzleIndex];
          const col = slotIndex % 3;
          const row = Math.floor(slotIndex / 3);
          
          slot.style.backgroundImage = `url('${activeItem.img}')`;
          slot.style.backgroundPosition = `${col * 50}% ${row * 100}%`;

          const pieceEl = piecesPanel.querySelector(`[data-index="${draggedIndex}"]`);
          if (pieceEl) pieceEl.remove();

          placedCount++;
          if (placedCount === 6) {
            setTimeout(() => {
              modal.style.display = 'flex';
            }, 300);
          }
        }
      });
    });

    document.getElementById('tab-champ').addEventListener('click', (e) => {
      currentTab = 'champ';
      currentPuzzleIndex = 0;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      loadPuzzle();
    });

    document.getElementById('tab-explorer').addEventListener('click', (e) => {
      currentTab = 'explorer';
      currentPuzzleIndex = 0;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      loadPuzzle();
    });

    function nextPuzzle() {
      currentPuzzleIndex = (currentPuzzleIndex + 1) % watchData[currentTab].length;
      loadPuzzle();
    }

    loadPuzzle();
  </script>
</body>
</html>
